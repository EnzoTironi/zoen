# STUB ONLY — D04 / EX35. Do not `fly deploy` or `fly apps create` from this file
# without an explicit activation package. Candidate app name is not provisioned yet.
#
# Legacy app `zoen` is a different product topology; do not cut over here.

app = "zoen-rebuild"
primary_region = "gru"
kill_signal = "SIGTERM"
kill_timeout = "45s"

[build]
  dockerfile = "ops/containers/application.Dockerfile"

[env]
  ZOEN_LISTEN_HOST = "0.0.0.0"
  ZOEN_PORT = "4310"
  # Secrets (DATABASE_URL / S3 / Better Auth / etc.) must be set via `fly secrets`
  # after an activation EX — never commit credentials.

[http_service]
  internal_port = 4310
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type = "connections"
    hard_limit = 100
    soft_limit = 80

[[http_service.checks]]
  interval = "15s"
  timeout = "5s"
  grace_period = "2m"
  method = "GET"
  path = "/ready"
