name: Deploy Fly

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  packages: read

concurrency:
  group: deploy-fly-zoen-rebuild
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - name: Refuse non-main refs
        run: |
          set -euo pipefail
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "Refusing deploy from ${{ github.ref }}; only refs/heads/main is admitted."
            exit 1
          fi

      # Checkout before verify_gate so deploy_gate.py can select the qualifying main-push run.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Wait for Verify success on this commit
        id: verify_gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHA="${{ github.sha }}"
          EVENT="${{ github.event_name }}"
          echo "Waiting for Verify (verify.yml) on ${SHA} (event=${EVENT})"
          for _ in $(seq 1 120); do
            rows="$(gh run list --repo "${{ github.repository }}" --workflow verify.yml --commit "${SHA}" --limit 20 --json databaseId,status,conclusion,createdAt,event,headBranch)"
            # Only main-push Verify runs publish the registry digest; ignore newer PR/non-main runs.
            newest="$(printf '%s' "${rows}" | python3 tests/integration/hosted/exact_image/deploy_gate.py --select-verify-run)"
            if [ -z "${newest}" ] || [ "${newest}" = "null" ]; then
              echo "status=none conclusion=none (no qualifying main-push Verify run yet)"
              sleep 30
              continue
            fi
            status="$(echo "${newest}" | jq -r '.status // empty')"
            conclusion="$(echo "${newest}" | jq -r '.conclusion // empty')"
            run_id="$(echo "${newest}" | jq -r '.databaseId // empty')"
            echo "run_id=${run_id} status=${status:-none} conclusion=${conclusion:-none} (qualifying main-push)"
            if [ "${status}" = "completed" ]; then
              echo "verify_run_id=${run_id}" >> "$GITHUB_OUTPUT"
              echo "verify_conclusion=${conclusion}" >> "$GITHUB_OUTPUT"
              if [ "${conclusion}" = "success" ]; then
                echo "deploy=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              # Rapid main pushes cancel Verify via concurrency; this SHA is
              # superseded — skip deploy without failing. Newer tip Deploy matters.
              # Manual dispatch must not treat cancelled/skipped as admission.
              if [ "${conclusion}" = "cancelled" ] || [ "${conclusion}" = "skipped" ]; then
                if [ "${EVENT}" = "push" ]; then
                  echo "Verify ${conclusion} for ${SHA} (superseded); skipping deploy without failure."
                  echo "deploy=false" >> "$GITHUB_OUTPUT"
                  exit 0
                fi
                echo "Verify ${conclusion} for ${SHA}; refusing manual deploy."
                exit 1
              fi
              echo "Verify failed for ${SHA} (conclusion=${conclusion}); refusing deploy."
              exit 1
            fi
            sleep 30
          done
          echo "Timed out waiting for Verify on ${SHA}"
          exit 1

      - name: Download exact-image admission for this Verify run
        if: steps.verify_gate.outputs.deploy == 'true'
        id: admission
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHA="${{ github.sha }}"
          RUN_ID="${{ steps.verify_gate.outputs.verify_run_id }}"
          mkdir -p .local/exact-image-admission-download
          gh run download "${RUN_ID}" \
            --repo "${{ github.repository }}" \
            --name exact-image-admission \
            --dir .local/exact-image-admission-download
          # Artifact may unpack flat or nested; locate admission.json under the download dir only.
          ADMISSION="$(find .local/exact-image-admission-download -type f -name admission.json | head -n 1)"
          if [ -z "${ADMISSION}" ]; then
            echo "admission.json missing from Verify artifact for run ${RUN_ID}"
            exit 1
          fi
          echo "admission_path=${ADMISSION}" >> "$GITHUB_OUTPUT"
          # Bind commit/run identity; refuse substituted digest by never accepting inputs.
          REF="$(python3 tests/integration/hosted/exact_image/deploy_gate.py \
            --admission "${ADMISSION}" \
            --commit "${SHA}" \
            --event-name "${{ github.event_name }}" \
            --verify-conclusion "${{ steps.verify_gate.outputs.verify_conclusion }}" \
            --verify-run-id "${RUN_ID}" \
            --print reference)"
          IMAGE_ID="$(python3 tests/integration/hosted/exact_image/deploy_gate.py \
            --admission "${ADMISSION}" \
            --commit "${SHA}" \
            --event-name "${{ github.event_name }}" \
            --verify-conclusion success \
            --verify-run-id "${RUN_ID}" \
            --print image_id)"
          echo "image_ref=${REF}" >> "$GITHUB_OUTPUT"
          echo "image_id=${IMAGE_ID}" >> "$GITHUB_OUTPUT"
          echo "Admitted exact image ${REF} (id=${IMAGE_ID})"

      - name: Setup flyctl
        if: steps.verify_gate.outputs.deploy == 'true'
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
        with:
          version: "0.4.99"

      - name: Promote admitted image to Fly and deploy
        if: steps.verify_gate.outputs.deploy == 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_REF: ${{ steps.admission.outputs.image_ref }}
          IMAGE_ID: ${{ steps.admission.outputs.image_id }}
        run: |
          set -euo pipefail
          SHA="${{ github.sha }}"
          echo "${GITHUB_TOKEN}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker pull "${IMAGE_REF}"
          PULLED_ID="$(docker image inspect --format '{{.Id}}' "${IMAGE_REF}")"
          if [ "${PULLED_ID}" != "${IMAGE_ID}" ]; then
            echo "Pulled image id ${PULLED_ID} != admitted ${IMAGE_ID}; refusing deploy."
            exit 1
          fi
          flyctl auth docker
          FLY_TAG="registry.fly.io/zoen-rebuild:sha-${SHA}"
          docker tag "${IMAGE_REF}" "${FLY_TAG}"
          docker push "${FLY_TAG}"
          FLY_DIGESTS="$(docker image inspect --format '{{json .RepoDigests}}' "${FLY_TAG}")"
          FLY_REF="$(echo "${FLY_DIGESTS}" | jq -r '.[] | select(startswith("registry.fly.io/zoen-rebuild@"))' | head -n 1)"
          if [ -z "${FLY_REF}" ]; then
            echo "Missing Fly registry digest after push"
            exit 1
          fi
          # Deploy the pushed exact bytes by digest — no uncontrolled rebuild from Dockerfile.
          flyctl deploy -a zoen-rebuild --config ops/fly/fly.toml --image "${FLY_REF}"

      - name: Health check (fail closed; not admission)
        if: steps.verify_gate.outputs.deploy == 'true'
        run: |
          set -euo pipefail
          # /ready alone cannot certify the artifact; admission already bound the digest.
          for _ in $(seq 1 36); do
            if curl -fsS https://zoen-rebuild.fly.dev/ready; then
              echo
              echo "ready ok"
              exit 0
            fi
            sleep 10
          done
          echo "Health check failed after deploy"
          exit 1
