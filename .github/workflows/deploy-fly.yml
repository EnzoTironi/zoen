name: Deploy Fly

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-fly-zoen-rebuild
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - name: Wait for Verify success on this commit
        id: verify_gate
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHA="${{ github.sha }}"
          echo "Waiting for Verify (verify.yml) on ${SHA}"
          for _ in $(seq 1 120); do
            row="$(gh run list --repo "${{ github.repository }}" --workflow verify.yml --commit "${SHA}" --limit 1 --json status,conclusion)"
            status="$(echo "${row}" | jq -r '.[0].status // empty')"
            conclusion="$(echo "${row}" | jq -r '.[0].conclusion // empty')"
            echo "status=${status:-none} conclusion=${conclusion:-none}"
            if [ "${status}" = "completed" ]; then
              if [ "${conclusion}" = "success" ]; then
                echo "deploy=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              # Rapid main pushes cancel Verify via concurrency; this SHA is
              # superseded — skip deploy without failing. Newer tip Deploy matters.
              if [ "${conclusion}" = "cancelled" ] || [ "${conclusion}" = "skipped" ]; then
                echo "Verify ${conclusion} for ${SHA} (superseded); skipping deploy without failure."
                echo "deploy=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              echo "Verify failed for ${SHA} (conclusion=${conclusion}); refusing deploy."
              exit 1
            fi
            sleep 30
          done
          echo "Timed out waiting for Verify on ${SHA}"
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: github.event_name != 'push' || steps.verify_gate.outputs.deploy == 'true'

      - name: Setup flyctl
        if: github.event_name != 'push' || steps.verify_gate.outputs.deploy == 'true'
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
        with:
          version: "0.4.99"

      - name: Deploy zoen-rebuild
        if: github.event_name != 'push' || steps.verify_gate.outputs.deploy == 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy -a zoen-rebuild --config ops/fly/fly.toml

      - name: Health check (fail closed)
        if: github.event_name != 'push' || steps.verify_gate.outputs.deploy == 'true'
        run: |
          set -euo pipefail
          # Verify also runs on main; this post-deploy probe fails closed if the
          # new release is not ready (Fly http_service checks alone are not enough).
          for _ in $(seq 1 36); do
            if curl -fsS https://zoen-rebuild.fly.dev/ready; then
              echo
              echo "ready ok"
              exit 0
            fi
            sleep 10
          done
          echo "Health check failed after deploy"
          exit 1
