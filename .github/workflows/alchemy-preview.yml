# Optional PR preview via alchemy (Fly ephemeral stage). Default: off.
# Enable with repository variable ZOEN_ALCHEMY_PREVIEW=1 and secret FLY_API_TOKEN.
name: Alchemy preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read

concurrency:
  group: alchemy-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  deploy:
    if: >
      github.event.action != 'closed' && vars.ZOEN_ALCHEMY_PREVIEW == '1' && secrets.FLY_API_TOKEN != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - run: pnpm install --frozen-lockfile
      - name: alchemy deploy pr stage
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          # Ephemeral stages build all-in-one locally; not the ZA-07 admit path.
          CI: "true"
        run: pnpm exec alchemy deploy ops/alchemy/alchemy.run.ts --stage "pr-${{ github.event.pull_request.number }}" --yes

  destroy:
    if: >
      github.event.action == 'closed' && vars.ZOEN_ALCHEMY_PREVIEW == '1' && secrets.FLY_API_TOKEN != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - run: pnpm install --frozen-lockfile
      - name: alchemy destroy pr stage
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          CI: "true"
        run: pnpm exec alchemy destroy ops/alchemy/alchemy.run.ts --stage "pr-${{ github.event.pull_request.number }}" --yes
