# ZN-0004 disposable test dependencies — PostgreSQL 18 + MinIO object storage.
# Digests recorded from Docker Hub at implementation time; do not invent hashes.
# Usage: docker compose -f compose.test.yaml up -d
# Tear down namespaces after harness cleanup. Not a production deployment.

services:
  postgres:
    image: postgres:18@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
    environment:
      POSTGRES_USER: zoen_test
      POSTGRES_PASSWORD: zoen_test_disposable
      POSTGRES_DB: zoen_harness
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zoen_test -d zoen_harness"]
      interval: 3s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio@sha256:a1ea29fa28355559ef137d71fc570e508a214ec84ff8083e39bc5428980b015e
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: zoen_test_access
      MINIO_ROOT_PASSWORD: zoen_test_secret_disposable
    ports:
      - "59000:9000"
      - "59001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 3s
      timeout: 5s
      retries: 20
